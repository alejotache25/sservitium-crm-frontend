      RAILS_LOG_TO_STDOUT: "true"
      SECRET_KEY_BASE: b58aa8cc00804fb1be7eab421318d06196b4b0192a6fbdb28e6cadb521f19ed427333ec8b7c1ed3c9bdd5bb993cc343397e835927fbae2f47226d367aa1f18aa
      JWT_SECRET_KEY: 11b7a3d2d9670f1ca395ca9715a993aa275298a56509334159a029ae7df0761f
