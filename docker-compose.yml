# =============================================================================
# Evo CRM Community v1.0.0 — adaptado para EasyPanel (Compose Service)
#
# Diferencias vs docker-compose.swarm.yaml oficial:
#   - Sin secciones deploy: / labels Traefik / puertos publicados
#     (EasyPanel enruta por Dominios -> servicio interno + puerto)
#   - Postgres con pgvector INCLUIDO (pgvector/pgvector:pg16) — el swarm
#     lo exigia externo; aqui va dentro del stack como servicio "pgvector"
#   - Red default de Compose (todos los servicios se ven por nombre)
#   - Volumenes nombrados gestionados por Compose (sin external:)
#   - Imagenes fijadas a 1.0.0 (estable, jul 2026) en vez de latest
#   - Variables interpoladas desde el Environment (.env) de EasyPanel
# =============================================================================

services:

  # --------------------------- BASE DE DATOS (pgvector) ----------------------
  pgvector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: evocrm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 9db13a0f53877322cf311ea9f4f326a4
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evocrm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --------------------------- REDIS -----------------------------------------
  evocrm_redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--port", "6379"]
    volumes:
      - evocrm_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------- RABBITMQ (broker EvoFlow) ---------------------
  evocrm_rabbitmq:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: evoflow
      RABBITMQ_DEFAULT_PASS: c6050948543269a26657e73596f57a20
    volumes:
      - evocrm_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # --------------------------- CLICKHOUSE (eventos EvoFlow) ------------------
  evocrm_clickhouse:
    image: clickhouse/clickhouse-server:latest
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: 4c3361fa4f4af5d13caacae222058c63
      CLICKHOUSE_DB: default
    volumes:
      - evocrm_clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "4c3361fa4f4af5d13caacae222058c63", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --------------------------- NGINX API GATEWAY (puerto 3030) ---------------
  evocrm_gateway:
    image: evoapicloud/evo-crm-gateway:1.0.0
    restart: unless-stopped
    environment:
      AUTH_UPSTREAM: evocrm_auth:3001
      CRM_UPSTREAM: evocrm_crm:3000
      CORE_UPSTREAM: evocrm_core:5555
      PROCESSOR_UPSTREAM: evocrm_processor:8000
      BOT_RUNTIME_UPSTREAM: evocrm_bot_runtime:8080
      FLOW_UPSTREAM: evocrm_evoflow:3334
    ports:
